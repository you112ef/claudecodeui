<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Products - TechShop</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@3.4.10/dist/tailwind.min.css" rel="stylesheet" />
  <script defer src="/public/js/products.js"></script>
</head>
<body class="bg-gray-50 text-gray-900">
  <header class="border-b bg-white">
    <div class="max-w-6xl mx-auto p-4 flex justify-between items-center">
      <a href="/pages/index.html" class="text-2xl font-bold">TechShop</a>
      <nav class="space-x-4">
        <a href="/pages/products.html" class="hover:underline">Products</a>
        <a href="/pages/about.html" class="hover:underline">About</a>
        <a href="/pages/contact.html" class="hover:underline">Contact</a>
      </nav>
    </div>
  </header>
  <main class="max-w-6xl mx-auto p-6">
    <div class="flex items-center gap-4 mb-6">
      <input id="searchInput" type="search" placeholder="Search products..." class="w-full border rounded-md p-2">
      <select id="categorySelect" class="border rounded-md p-2">
        <option value="">All Categories</option>
      </select>
    </div>
    <div id="productsGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6"></div>
  </main>
</body>
</html>
